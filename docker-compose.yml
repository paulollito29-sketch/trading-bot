# Bot 24/7 en tu PC o en un VPS (~5 USD/mes). Requisitos: Docker + un archivo .env (copia .env.example).
#   docker compose build                                   # construir la imagen
#   docker compose run --rm engine cryptobot download      # bajar el histórico (primera vez)
#   docker compose run --rm engine cryptobot research --profile lemon   # entrenar y validar
#   docker compose up -d                                   # iniciar (se reinicia solo si se cae)
#   docker compose logs -f engine                          # ver qué hace
services:
  engine:
    build: ./engine
    env_file: .env
    restart: unless-stopped
    # Volúmenes de Docker (no carpetas de tu equipo): funcionan igual en Windows, Mac y Linux,
    # con los permisos correctos y SQLite sin problemas de bloqueo. Sobreviven a reinicios y a
    # "docker compose down"; solo "docker compose down -v" los borra.
    volumes:
      - data:/app/data
      - models:/app/models
      - reports:/app/reports
    command: ["cryptobot", "run"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
  models:
  reports:
