name: CI

on:
  push:
  pull_request:

jobs:
  engine:
    name: Motor (Python) — lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests (sin red)
        run: pytest -q -m "not network"

  dashboard:
    name: Panel (React) — type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Imagen Docker — build + arranque
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Construir la imagen (Dockerfile real)
        run: docker compose build
      - name: Arranca como bot, carga LightGBM y escribe en los volúmenes data, models y reports
        run: >-
          docker compose run --rm -T engine sh -c
          'id -un && for d in data models reports; do touch /app/$d/.ok; done
          && python -c "import lightgbm" && cryptobot --help > /dev/null && echo OK'
